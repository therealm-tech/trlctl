name: build

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - packaging/**
      - scripts/homebrew-formula.sh
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - packaging/**
      - scripts/homebrew-formula.sh
      - .github/workflows/build.yaml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: read the version from Cargo.toml
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binaries:
    name: binaries
    needs:
      - version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version --verbose
      - name: build the release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: package the archive and its checksum
        run: |
          name="trlctl-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/trlctl" LICENSE README.md "dist/${name}/"
          "dist/${name}/trlctl" --version
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          cat "dist/${name}.tar.gz.sha256"
      - name: upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  formula:
    name: homebrew formula
    needs:
      - version
      - binaries
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: render the formula from the checksums
        run: |
          mkdir -p Formula
          scripts/homebrew-formula.sh "$VERSION" dist > Formula/trlctl.rb
          cat Formula/trlctl.rb
      - name: check the formula with brew style
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: /home/linuxbrew/.linuxbrew/bin/brew style Formula/trlctl.rb
      - name: upload the formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: Formula/trlctl.rb
          if-no-files-found: error
