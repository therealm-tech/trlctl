name: renovate

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run Renovate in dry-run mode
        required: false
        default: false
        type: boolean
      logLevel:
        description: Log level
        required: false
        default: info
        type: choice
        options:
          - debug
          - info
          - warn
          - error

# Renovate writes with RENOVATE_TOKEN, so that its PRs trigger the other
# workflows; the job itself only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run Renovate
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          # Updating mise.lock runs `mise lock`; without this Renovate blocks
          # every mise operation and neither mise.toml nor mise.lock moves.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
