name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: check the version
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: compare the tag with Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          committed="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [ "$committed" != "$version" ]; then
            echo "Cargo.toml says ${committed} but the tag says ${version}." >&2
            echo "Cut releases with scripts/release.sh so the two stay in step." >&2
            exit 1
          fi

  build:
    name: build
    needs:
      - version
    # self-repository: actionlint 1.7.12 rejects GitHub's `$/` syntax. Switch to
    # `$/.github/workflows/build.yaml` once actionlint accepts it.
    uses: ./.github/workflows/build.yaml # zizmor: ignore[self-repository]

  github-release:
    name: GitHub release
    needs:
      - build
    # A pre-release tag gets no release page, and so no Homebrew formula.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: attest the build provenance of the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: create the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | awk -v tag="$TAG" '$0 == tag { print previous; exit } { previous = $0 }')"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" "${args[@]}" dist/*.tar.gz dist/*.tar.gz.sha256

  homebrew:
    name: Homebrew formula
    needs:
      - github-release
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - name: download the formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula
      - name: mint a token for the tap
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: therealm-tech
          repositories: homebrew-tap
          permission-contents: write
      - name: commit the formula to the tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ github.ref_name }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "users/${bot}" --jq .id)"
          gh auth setup-git
          git init --quiet --initial-branch main tap
          cd tap
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git remote add origin https://github.com/therealm-tech/homebrew-tap.git
          # The tap starts empty: its first formula creates `main`.
          if git ls-remote --exit-code --heads origin main > /dev/null; then
            git fetch --quiet --depth 1 origin main
            git checkout --quiet -B main FETCH_HEAD
          fi
          mkdir -p Formula
          cp ../formula/trlctl.rb Formula/trlctl.rb
          git add Formula/trlctl.rb
          if git diff --cached --quiet; then
            echo "Formula/trlctl.rb is already at ${VERSION}."
            exit 0
          fi
          git commit --quiet --message "trlctl ${VERSION#v}"
          git push origin HEAD:main

  crates-io:
    name: crates.io
    needs:
      - build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check whether crates.io already has this version
        id: published
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent "trlctl release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/trlctl/${TAG#v}")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered HTTP ${status}." >&2; exit 1 ;;
          esac
      - name: install the Rust toolchain from rust-toolchain.toml
        if: steps.published.outputs.published == 'false'
        run: rustup toolchain install
      - name: authenticate with crates.io trusted publishing
        if: steps.published.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: publish the crate
        if: steps.published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
