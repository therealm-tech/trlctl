[package]
name = "trlctl"
version = "0.1.0"
edition = "2024"
description = "Scaffold and validate repositories that follow the therealm Argo CD layout"
authors = ["Guillaume Leroy <gleroy@therealm.tech>"]
repository = "https://github.com/therealm-tech/trlctl"
readme = "README.md"
license = "MIT"
exclude = [
    ".github/",
    "docs/",
]
keywords = [
    "argocd",
    "gitops",
    "kubernetes",
    "layout",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
