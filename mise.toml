min_version = "2026.11.10"

[tools]
"cargo:cargo-edit" = "0.13.14"
# Builds the actionlint hook.
go = "1.27.4"
pre-commit = "4.7.0"
# No Python code here: pre-commit builds its hook environments with it.
python = "3.13.18"
rust = { version = "1.98.1", components = "clippy,rustfmt", profile = "minimal" }
task = "3.54.0"

[settings]
lockfile = true
disable_backends = ["asdf", "vfox"]
